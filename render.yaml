services:
  - type: web
    name: advanced-pdfsafescan-api
    env: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    autoDeploy: true
    envVars:
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PUBLIC_BASE_URL
        sync: false
      - key: DASHBOARD_PUBLIC_URL
        sync: false
      - key: MODEL_DIR
        value: ./models
      - key: DATA_DIR
        value: ./data
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: RECENT_SCAN_LIMIT
        value: "12"
