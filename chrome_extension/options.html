<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advanced PDFSafeScan Settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings-shell">
      <section class="settings-panel">
        <div class="header-badge">Extension Settings</div>
        <h1>Advanced PDFSafeScan</h1>
        <p>Manage local PDF scanning preferences for the secure hosted service. Production backend routing and access controls are managed separately and are not editable here.</p>

        <form id="settings-form" class="settings-form">
          <label class="toggle-row">
            <input id="autoScanDownloads" name="autoScanDownloads" type="checkbox">
            <span>Automatically scan downloaded PDFs</span>
          </label>

          <label class="toggle-row">
            <input id="autoScanOpenedPdfs" name="autoScanOpenedPdfs" type="checkbox">
            <span>Automatically scan PDFs opened in the browser</span>
          </label>

          <label class="toggle-row">
            <input id="enableNotifications" name="enableNotifications" type="checkbox">
            <span>Enable browser notifications</span>
          </label>

          <label class="toggle-row">
            <input id="warnOnSuspicious" name="warnOnSuspicious" type="checkbox">
            <span>Warn on suspicious results</span>
          </label>

          <label class="toggle-row">
            <input id="autoOpenDashboardForMalicious" name="autoOpenDashboardForMalicious" type="checkbox">
            <span>Auto-open dashboard for malicious results</span>
          </label>

          <div class="button-row">
            <button type="submit" class="primary-button">Save Preferences</button>
            <button id="reset-defaults" type="button" class="secondary-button">Reset Defaults</button>
          </div>
        </form>

        <p id="save-status" class="save-status">Preferences are stored in Chrome sync storage.</p>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
